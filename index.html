  </head>
  <body>
    <!-- Окно авторизации/регистрации -->
    <div id="authContainer" class="auth-container">
      <div class="auth-box">
        <div
          style="
            display: flex;
            justify-content: space-between;
            align-items: center;
          "
        ></div>
        <div id="loginForm" class="form">
          <h2 data-i18n="login_heading">Вход</h2>
          <input
            type="text"
            id="loginUsername"
            class="neon-input"
            data-i18n="username_placeholder"
            data-i18n-attr="placeholder"
          />
          <input
            type="password"
            id="loginPassword"
            class="neon-input"
            data-i18n="password_placeholder"
            data-i18n-attr="placeholder"
          />
          <button id="loginBtn" class="loginBtn" data-i18n="login_btn">
            Войти
          </button>
          <p class="switch-text">
            <span data-i18n="no_account">Нет аккаунта?</span>
            <span id="toRegister" data-i18n="register_btn"
              >Зарегистрироваться</span
            >
          </p>
          <p id="loginError" class="error-text"></p>
        </div>
        <div id="registerForm" class="form" style="display: none">
          <h2 data-i18n="register_heading">Регистрация</h2>
          <input
            type="text"
            id="registerUsername"
            class="neon-input"
            data-i18n="username_placeholder"
            data-i18n-attr="placeholder"
          />
          <input
            type="password"
            id="registerPassword"
            class="neon-input"
            data-i18n="password_placeholder"
            data-i18n-attr="placeholder"
          />
          <button id="registerBtn" class="" data-i18n="register_btn">
            Зарегистрироваться
          </button>
          <p class="switch-text">
            <span data-i18n="have_account">Уже есть аккаунт?</span>
            <span id="toLogin" data-i18n="login_btn">Войти</span>
          </p>
          <p id="registerError" class="error-text"></p>
        </div>
      </div>
      <div id="langButtons" style="display: flex; gap: 8px">
        <button id="btnRu" class="ukBtn"></button>
        <button id="btnEn" class="enBtn"></button>
      </div>
    </div>

    <!-- Игровой контейнер (скрыт по умолчанию) -->
    <div id="gameContainer" style="display: none">
      <canvas
        id="game3DCanvas"
        style="
          position: fixed;
          inset: 0;
          width: 100vw;
          height: 100vh;
          display: none;
          z-index: 0;
          pointer-events: auto;
          background: #050b16;
        "
      ></canvas>
      <canvas id="gameCanvas" style="position: relative; z-index: 1"></canvas>
      <div id="stats">
        <span id="health" data-i18n="stats_health">Здоровье</span><br />
        <span id="energy" data-i18n="stats_energy">Энергия</span><br />
        <span id="food" data-i18n="stats_food">Еда</span><br />
        <span id="water" data-i18n="stats_water">Вода</span><br />
        <span id="armor" data-i18n="stats_armor">Броня</span>
      </div>
      <div id="coords"></div>
      <div id="onlineCount" class="cyber-text"></div>
      <img
        id="chatBtn"
        class="cyber-btn-img"
        src="images/chat.png"
        data-i18n="chat_label"
        data-i18n-attr="alt"
      />
      <img
        id="rendererModeBtn"
        class="cyber-btn-img"
        src="images/settings.png"
        data-i18n="renderer_mode_button"
        data-i18n-attr="alt"
      />
      <img
        id="inventoryBtn"
        class="cyber-btn-img"
        src="images/inventory.png"
        data-i18n="inventory"
        data-i18n-attr="alt"
      />
      <img
        id="combatBtn"
        class="cyber-btn-img"
        data-i18n="combat"
        data-i18n-attr="alt"
      />
      <img
        id="skillsBtn"
        class="cyber-btn-img"
        src="images/skills.png"
        data-i18n="skills"
        data-i18n-attr="alt"
      />
      <div id="chatContainer">
        <div id="chatMessages"></div>
        <div id="chatInputContainer">
          <input
            type="text"
            id="chatInput"
            maxlength="200"
            data-i18n="chat_input_placeholder"
            data-i18n-attr="placeholder"
            placeholder="ВВЕДИ СООБЩЕНИЕ..."
          />
        </div>
      </div>
      <dialog
        id="rendererModeDialog"
        class="renderer-mode-dialog"
        aria-labelledby="rendererModeTitle"
      >
        <section class="renderer-mode-panel">
          <h2 id="rendererModeTitle" data-i18n="renderer_mode_title">
            Режим отображения
          </h2>
          <div class="renderer-mode-instructions">
            <h3 data-i18n="renderer_mode_instructions_title">Как играть</h3>
            <ul>
              <li data-i18n="renderer_mode_move_instruction">
                WASD или стрелки — перемещение
              </li>
              <li data-i18n="renderer_mode_camera_instruction">
                Колесо мыши — масштаб; правая кнопка мыши и перетаскивание —
                поворот камеры в 3D
              </li>
            </ul>
          </div>
          <label class="renderer-mode-option">
            <span data-i18n="renderer_3d_toggle">Включить 3D режим</span>
            <span class="renderer-mode-switch">
              <input id="renderer3DToggle" type="checkbox" />
              <span class="renderer-mode-switch-track"></span>
            </span>
          </label>
          <p class="renderer-mode-escape-hint" data-i18n="renderer_mode_escape">
            Esc — выход
          </p>
          <p
            id="rendererModeStatus"
            class="renderer-mode-status"
            role="status"
            aria-live="polite"
          ></p>
          <button
            id="rendererModeCancelBtn"
            class="renderer-mode-cancel"
            type="button"
            data-i18n="cancel_btn"
          >
            Отмена
          </button>
        </section>
      </dialog>
      <div id="inventoryContainer">
        <div id="inventoryScreen"></div>
        <div id="inventoryActions">
          <button id="useBtn" class="use-btn" disabled data-i18n="use_btn">
            Использовать
          </button>
          <button id="dropBtn" class="drop-btn" disabled data-i18n="drop_btn">
            Выбросить
          </button>
        </div>
      </div>
      <div id="skillsContainer" style="display: none">
        <div id="skillsGrid"></div>
        <div id="skillsDescription"></div>
      </div>
